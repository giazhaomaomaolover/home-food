function readPlanForm(old) {
  const v = id => (document.getElementById(id) || {}).value, n = id => { const x = parseFloat(v(id)); return isFinite(x) ? x : null; };
  const row = pre => ({ kcal: Math.round(n(pre + '-kcal') || 0), P: Math.round(n(pre + '-P') || 0), F: Math.round(n(pre + '-F') || 0), C: Math.round(n(pre + '-C') || 0) });
  const base = S.planDraft || old || {};
  const highDays = highDaysOf(base);
  const split = highDays.length > 0;
  const weekday = row('pd');
  const weekend = document.getElementById('pe-kcal') ? row('pe') : (old && old.weekend && old.weekend.kcal ? old.weekend : { ...weekday });
  const lastW = Object.keys(S.weights).sort().pop();
  return { ...(old || {}), style: base.style || 'balanced', highDays, highPct: base.highPct ?? 10, protPerLb: n('pl-prot') ?? base.protPerLb ?? 0.8, goalLb: n('pl-goal'), rateLb: n('pl-rate') ?? 0, tdee: Math.round(n('pl-tdee') || 0) || null, split, weekday, weekend,
    startLb: old && old.startLb ? old.startLb : (lastW ? toLb(S.weights[lastW].kg) : null),
    startDay: old && old.startDay ? old.startDay : ymdOf(new Date()), lastCheckin: old && old.lastCheckin ? old.lastCheckin : ymdOf(new Date()) };
}
function savePlan(p) {
  const uid = me();
  S.goals[uid] = { ...(S.goals[uid] || {}), plan: p, kcal: p.weekday.kcal || null, protein: p.weekday.P || null };
  persistFit(); Sync.op('plan_save', p);
}
function goalsClick(a, b) {
  const uid = me(), p = planOf(uid);
  switch (a) {
    case 'tinfo': S.tInfo = { ...(S.tInfo || {}), [b.dataset.id]: !(S.tInfo || {})[b.dataset.id] }; break;
    case 'pl-setup': S.planEdit = true; S.planMsg = ''; break;
    case 'pl-cancel': S.planEdit = false; S.planDraft = null; S.planMsg = ''; break;
    case 'pl-style': S.planDraft = { ...readPlanForm(p), style: b.dataset.v }; break;
    case 'pl-day': { const d0 = readPlanForm(p), i = +b.dataset.d, hd = highDaysOf(d0); const nh = hd.includes(i) ? hd.filter(x => x !== i) : [...hd, i].sort(); S.planDraft = { ...d0, highDays: nh, split: nh.length > 0 }; break; }
    case 'pl-pct': S.planDraft = { ...readPlanForm(p), highPct: +b.dataset.v }; break;
    case 'pl-calc': { const d0 = readPlanForm(p); const nt = calcTargets(d0, +d0.tdee || 0, currentLb() || d0.startLb); S.planDraft = { ...d0, weekday: nt.weekday, weekend: nt.weekend }; S.planMsg = ''; break; }
    case 'pl-save': { const np = readPlanForm(p); savePlan(np); S.planDraft = null; S.planMsg = t('planSaved'); S.planEdit = false; break; }
    case 'ci-show': S.ciShow = true; S.planMsg = ''; break;
    case 'ci-apply': {
      const ex = expenditure(uid, ymdOf(new Date())), tdee = ex.ready ? ex.value : +p.tdee, nt = proposeTargets(p, tdee);
      savePlan({ ...p, tdee, weekday: nt.weekday, weekend: nt.weekend, lastCheckin: ymdOf(new Date()) }); S.ciShow = false; S.planMsg = t('ciDone'); break;
    }
    case 'ci-keep': savePlan({ ...p, lastCheckin: ymdOf(new Date()) }); S.ciShow = false; S.planMsg = t('ciKept'); break;
    default: return false;
  }
  render(); return true;
}
// Me → Trends: expenditure, energy balance and goal progress at the top
function insightCards(who) {
  if (who !== me()) return '';
  const today = ymdOf(new Date()), p = planOf(who), ex = expenditure(who, today);
  const cells = [];
  if (ex.value) cells.push(`<div class="ins" style="--mc:${CAT_COLOR.food}">${metricTitle('exp', t('expH'))}${metricInfo('exp')}<b>${ex.value.toLocaleString()} <small>kcal</small></b><em>${esc(t('expSub', ex.ready ? ex.logged : 0))}</em></div>`);
  if (ex.value) {
    const last7 = []; for (let i = 1; i <= 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); last7.push(ymdOf(d)); }
    const per = last7.map(ds => S.intake.filter(e => e.user === who && e.date === ds).reduce((a, e) => a + (e.kcal || 0), 0)).filter(v => v > 0);
    cells.push(`<div class="ins" style="--mc:${CAT_COLOR.food}">${metricTitle('bal', t('balH'))}${metricInfo('bal')}${per.length ? `<b>${esc(t('balV', Math.round(per.reduce((a, b) => a + b, 0) / per.length - ex.value)))}</b>` : `<em>${t('balNone')}</em>`}</div>`);
  }
  const lastW = Object.keys(S.weights).filter(d => d <= today).sort().pop();
  const firstW = p ? Object.keys(S.weights).filter(d => d >= (p.startDay || '')).sort()[0] : null;
  const startLb = p && (p.startLb || (firstW ? toLb(S.weights[firstW].kg) : null));
  if (p && p.goalLb && startLb && lastW) {
    const now = toLb((weightTrend(today) || {})[today] ?? S.weights[lastW].kg);
    const pct = Math.max(0, Math.min(100, Math.round((startLb - now) / (startLb - p.goalLb) * 100)));
    cells.push(`<div class="ins" style="--mc:${CAT_COLOR.body}">${metricTitle('prog', t('progH'))}${metricInfo('prog')}<b>${esc(t('progV', now.toFixed(1), p.goalLb, pct))}</b><div class="mtrack"><i style="width:${pct}%;background:var(--mc)"></i></div></div>`);
  }
  return cells.length ? `<div class="insights">${cells.join('')}</div>` : '';
}

render();
Sync.init();

</script>
<script>
// opening animation: one full hop at least, then fade out once the app has its data (or the sign-in screen)
(function () {
  const el = document.getElementById('splash'); if (!el) return;
  const t0 = performance.now(), MIN = 1650;
  const done = () => { clearInterval(iv); el.classList.add('out'); setTimeout(() => el.remove(), 420); };
  const iv = setInterval(() => { const ready = !(Sync.enabled && Sync.st.stage === 'loading'); if (ready && performance.now() - t0 > MIN) done(); }, 60);
  setTimeout(done, 7000);
})();
</script>
