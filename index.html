* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

main { flex: 1; padding: 0 18px 28px; display: flex; flex-direction: column; gap: 18px; }

.brand { font: 700 24px/1 var(--serif); letter-spacing: -.04em; }

.count { color: var(--muted); font-size: 13px; }

.top-actions { display: flex; gap: 10px; align-items: center; background: var(--wash); padding: 14px; border-radius: 12px 12px 0 0; }

.ing input { width: 22px; height: 22px; margin: 0; accent-color: var(--green); }

function ingredientIcon(name) {
  const art = ingredientArt.find(([pattern]) => pattern.test(name));

  return '<svg class="ingredient-icon" aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="#574338" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' + art[1] + '</svg>';
}

  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function weekStart(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return ymd(x); }
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

  const outbox = () => load('outbox', []);
  const setOutbox = o => save('outbox', o);
  const rerender = () => { if (typeof render === 'function') render(); };
  const fail = e => { st.busy = false; st.error = (e && (e.message || e.error_description)) || String(e); rerender(); };

  async function init() {
    if (!enabled) return;
    sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await sb.auth.getSession();
    if (data.session) {
      // the account may have been deleted on the server: check before trusting the saved login
      const u = await sb.auth.getUser();
      if (u.error && u.error.status !== undefined && u.error.status !== 0 && navigator.onLine) { await sb.auth.signOut({ scope: 'local' }); clearLocal(); st.stage = 'email'; rerender(); }
      else await afterLogin(data.session.user);
    } else { st.stage = 'email'; rerender(); }
    addEventListener('online', () => flush().then(pull));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.stage === 'ready') flush().then(pull); });
  }

  // email + password; email confirmation is turned off in Supabase, so no email is ever sent
  async function signIn(email, password, isNew) {
    st.busy = true; st.error = ''; st.email = email; rerender();
    const res = isNew ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if (res.error) return fail(res.error);
    if (!res.data.session) return fail({ message: 'confirm email is on' });
    await afterLogin(res.data.user);
  }
  async function changePassword(pw) {
    st.busy = true; st.error = ''; st.pwMsg = ''; rerender();
    const { error } = await sb.auth.updateUser({ password: pw });
    st.busy = false;
    if (error) return fail(error);
    st.pwMsg = 'ok'; rerender();
  }
  function setMode(m) { st.mode = m; st.error = ''; rerender(); }
  function backToEmail() { st.stage = 'email'; st.error = ''; rerender(); }

  async function afterLogin(user) {
    st.user = user; st.busy = false;
    const { data, error } = await sb.from('members').select('household_id, display_name, households(name, join_code)').eq('user_id', user.id).maybeSingle();
    if (error) { st.stage = 'email'; return fail(error); }
    if (!data) { st.stage = 'household'; rerender(); return; }
    st.household = { id: data.household_id, name: data.households.name, code: data.households.join_code };
    st.stage = 'ready';
    await flush(); await pull(); subscribe(); rerender();
  }

  async function createHousehold(name, display) {
    st.busy = true; st.error = ''; rerender();
    const { error } = await sb.rpc('create_household', { p_name: name, p_display: display });
    if (error) return fail(error);
    clearLocal(); await afterLogin(st.user);
  }
  async function joinHousehold(code, display) {
    st.busy = true; st.error = ''; rerender();
    const { error } = await sb.rpc('join_household', { p_code: code, p_display: display });
    if (error) return fail(error);
    clearLocal(); await afterLogin(st.user);
  }
  function clearLocal() { S.plan = []; S.checked = {}; S.saved = {}; S.intake = []; S.goals = {}; setOutbox([]); persist(); save('intake', []); save('goals', {}); }

  async function signOut() {
    if (channel) { sb.removeChannel(channel); channel = null; }
    await sb.auth.signOut();
    Object.assign(st, { stage: 'email', mode: 'in', user: null, household: null, members: [], error: '' });
    clearLocal(); rerender();
  }

  // pull the shared week plus my private favorites; skipped while my own changes are still waiting to upload
  async function pull() {
    if (!enabled || st.stage !== 'ready' || outbox().length) return;
    const h = st.household.id, wk = weekStart();
    const since = new Date(); since.setDate(since.getDate() - 35);
    const [plan, checks, favs, mem, intake] = await Promise.all([
      sb.from('plan_entries').select('id, day, recipe_id, ver, servings').eq('household_id', h).eq('week_start', wk).order('updated_at'),
      sb.from('shopping_checks').select('item_key').eq('household_id', h).eq('week_start', wk),
      sb.from('favorites').select('user_id, recipe_id'),
      sb.from('members').select('user_id, display_name, kcal_goal, protein_goal').eq('household_id', h),
      sb.from('intake_logs').select('id, user_id, eaten_on, meal, recipe_id, ver, portion, label, kcal, protein_g, carbs_g, fat_g').gte('eaten_on', ymd(since)).order('created_at'),
    ]);
    const err = plan.error || checks.error || favs.error || mem.error || intake.error;
    if (err) { st.status = 'offline'; rerender(); return; }
    S.plan = plan.data.filter(r => RECIPES.some(x => x.id === r.recipe_id)).map(r => ({ uid: r.id, id: r.recipe_id, ver: r.ver, servings: r.servings, day: r.day }));
    S.checked = Object.fromEntries(checks.data.map(r => [r.item_key, true]));
    st.members = mem.data; st.status = 'idle';
    const me = st.user.id, nameOf = id => (mem.data.find(m => m.user_id === id) || {}).display_name || '';
    S.saved = Object.fromEntries(favs.data.filter(r => r.user_id === me).map(r => [r.recipe_id, true]));
    S.goals = Object.fromEntries(mem.data.map(m => [m.user_id, { kcal: m.kcal_goal, protein: m.protein_goal }]));
    S.intake = intake.data.map(r => ({ uid: r.id, user: r.user_id, date: r.eaten_on, meal: r.meal, recipe_id: r.recipe_id, ver: r.ver, portion: +r.portion, label: r.label || '', kcal: r.kcal || 0, P: r.protein_g || 0, C: r.carbs_g || 0, F: r.fat_g || 0 }));
    save('intake', S.intake); save('goals', S.goals);
    S.partnerSaved = {};
    favs.data.filter(r => r.user_id !== me).forEach(r => { (S.partnerSaved[r.recipe_id] = S.partnerSaved[r.recipe_id] || []).push(nameOf(r.user_id)); });
    persist(); rerender();
  }
  function schedulePull() { clearTimeout(pullTimer); pullTimer = setTimeout(pull, 400); }
  function subscribe() {
    if (channel) return;
    const f = `household_id=eq.${st.household.id}`;
    channel = sb.channel('hh-' + st.household.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_entries', filter: f }, schedulePull)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'shopping_checks', filter: f }, schedulePull)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'intake_logs' }, schedulePull)
      .subscribe();
  }

  // every change goes into the outbox first, then uploads; replaying an op is safe
  function op(type, payload) {
    if (!enabled || st.stage !== 'ready') return;
    setOutbox([...outbox(), { type, payload, week: weekStart() }]);
    flush();
  }
  async function run({ type, payload: p, week }) {
    const h = st.household.id, me = st.user.id;
    if (type === 'plan_upsert') return sb.from('plan_entries').upsert({ id: p.uid, household_id: h, week_start: week, day: p.day, recipe_id: p.id, ver: p.ver, servings: p.servings, updated_at: new Date().toISOString() });
    if (type === 'plan_delete') return sb.from('plan_entries').delete().eq('id', p);
    if (type === 'check_add') return sb.from('shopping_checks').upsert({ household_id: h, week_start: week, item_key: p });
    if (type === 'check_del') return sb.from('shopping_checks').delete().match({ household_id: h, week_start: week, item_key: p });
    if (type === 'intake_upsert') return sb.from('intake_logs').upsert({ id: p.uid, user_id: me, eaten_on: p.date, meal: p.meal, recipe_id: p.recipe_id, ver: p.ver, portion: p.portion, label: p.label || null, kcal: p.kcal, protein_g: p.P, carbs_g: p.C, fat_g: p.F, updated_at: new Date().toISOString() });
    if (type === 'intake_delete') return sb.from('intake_logs').delete().eq('id', p);
    if (type === 'goals_save') return sb.from('members').update({ kcal_goal: p.kcal, protein_goal: p.protein }).eq('user_id', me);
    if (type === 'fav_add') return sb.from('favorites').upsert({ user_id: me, recipe_id: p });
    if (type === 'fav_del') return sb.from('favorites').delete().match({ user_id: me, recipe_id: p });
    return { error: null };
  }
  async function flush() {
    if (!enabled || st.stage !== 'ready' || flushing) return;
    flushing = true;
    let box = outbox();
    if (box.length) { st.status = 'syncing'; rerender(); }
    while (box.length) {
      let res;
      try { res = await run(box[0]); } catch (e) { res = { error: e }; }
      if (res.error) { st.status = 'offline'; break; }
      box = box.slice(1); setOutbox(box);
    }
    if (!box.length) st.status = 'idle';
    flushing = false; rerender();
  }

  return { enabled, st, init, signIn, setMode, changePassword, backToEmail, createHousehold, joinHousehold, signOut, op, newId, pending: () => outbox().length };
})();

const pill = st => `<span class="pill ${st}">${STATUS_I[LANG][st]}</span>`;

function cover(r, cls = '') {

}
function ingredientText(r) {
  const vs = [...Object.values(r.versions), ...Object.values(EN(r).v)];
  return vs.flatMap(v => v.groups.flatMap(([, rows]) => rows.map(x => x[1]))).join(' ');

const numOf = s => Math.max(...String(s).replace(/,/g, '').match(/[\d.]+/g).map(Number));
const VER_TEST = {
  low: v => v.status === 'ok',
  carb: v => numOf(v.n.C) * 4 / numOf(v.n.kcal) <= 0.26,
  fat: v => numOf(v.n.F) * 9 / numOf(v.n.kcal) <= 0.30,
};
const activeNut = () => Object.keys(S.nut).filter(k => S.nut[k]);
const verPasses = v => activeNut().every(k => VER_TEST[k](v));
// the version to show for a dish: lighter if it meets the active filters, otherwise the original
function pickVer(r) {
  if (r.versions.light && verPasses(r.versions.light)) return 'light';
  if (verPasses(r.versions.orig)) return 'orig';
  return r.versions.light ? 'light' : 'orig';
}
function viewCook() {

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; if (a === 'check' || a === 'prep') return;
  const val = id => (document.getElementById(id) || {}).value || '';
  if (a === 'a-mode') { Sync.st.email = val('a-email').trim(); Sync.setMode(b.dataset.m); return; }
  if (a === 'a-login') { const e = val('a-email').trim(), pw = val('a-pw'); if (e && pw) Sync.signIn(e, pw, Sync.st.mode === 'new'); return; }
  if (a === 'a-create') { Sync.createHousehold(val('a-hh').trim(), val('a-name').trim()); return; }
  if (a === 'a-join') { const c = val('a-join').trim(); if (c) Sync.joinHousehold(c, val('a-name').trim()); return; }
  if (a === 'a-out') { Sync.signOut(); return; }
  if (a === 'a-pw') { const pw = val('a-newpw'); if (pw) Sync.changePassword(pw); return; }
  if (fitnessClick(a, b)) return;
  if (a === 'jump') { ev.preventDefault(); document.getElementById('plan-add').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  const toTop = a === 'open' || a === 'back' || a === 'tab';
  if (a === 'open') { const r = byId(b.dataset.id); S.tab = 'cook'; S.recipe = r.id; S.ver = pickVer(r); S.servings = 2; S.addedDay = null; S.logged = null; }
  if (a === 'back') S.recipe = null;
  if (a === 'tab') { S.logMsg = ''; S.tab = b.dataset.t; if (S.tab === 'cook') S.recipe = null; }
  if (a === 'cuisine') S.cuisine = b.dataset.c;
  if (a === 'rtype') S.rtype = b.dataset.t;
  if (a === 'nut') S.nut[b.dataset.k] = !S.nut[b.dataset.k];
  if (a === 'save') { const id = b.dataset.id; if (S.saved[id]) { delete S.saved[id]; Sync.op('fav_del', id); } else { S.saved[id] = true; Sync.op('fav_add', id); } }
  if (a === 'lang') { LANG = LANG === 'en' ? 'zh' : 'en'; save('lang', LANG); }
  if (a === 'ver') { S.ver = b.dataset.v; S.addedDay = null; }
  if (a === 'serv') { S.servings = +b.dataset.s; S.addedDay = null; }
  if (a === 'day') { S.addDay = +b.dataset.d; S.addedDay = null; }
  if (a === 'add') { const r = byId(S.recipe); const e = { uid: Sync.newId(), id: r.id, ver: r.versions.light ? S.ver : 'orig', servings: S.servings, day: S.addDay }; S.plan.push(e); Sync.op('plan_upsert', e); S.addedDay = S.addDay; }
  if (a === 'pserv') { const e = S.plan[+b.dataset.i]; e.servings = +b.dataset.s; Sync.op('plan_upsert', e); }
  if (a === 'pver') { const e = S.plan[+b.dataset.i]; e.ver = e.ver === 'light' ? 'orig' : 'light'; Sync.op('plan_upsert', e); }
  if (a === 'pdel') { const [e] = S.plan.splice(+b.dataset.i, 1); Sync.op('plan_delete', e.uid); }
  if (a === 'range') S.range = b.dataset.r;
  persist(); render();
  if (toTop) window.scrollTo(0, 0);
});
document.addEventListener('change', ev => {
  const sel = ev.target.closest('select[data-act]');
  if (sel) { if (sel.dataset.act === 'rtype-sel') S.rtype = sel.value; if (sel.dataset.act === 'cuisine-sel') S.cuisine = sel.value; render(); return; }
  const c = ev.target.closest('[data-act="check"],[data-act="prep"]'); if (!c) return;
  if (c.dataset.act === 'check') { const k = c.dataset.k; if (c.checked) { S.checked[k] = true; Sync.op('check_add', k); } else { delete S.checked[k]; Sync.op('check_del', k); } persist(); }
  else { const r = byId(S.recipe), pk = r.id + ':' + (r.versions.light ? S.ver : 'orig'); S.prep[pk] = S.prep[pk] || {}; S.prep[pk][c.dataset.k] = c.checked; }
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
document.addEventListener('input', ev => {
  if (ev.target.id !== 'q') return;
  S.q = ev.target.value; const pos = ev.target.selectionStart; render();
  const el = document.getElementById('q'); el.focus(); el.setSelectionRange(pos, pos);
});

// ---- Today: food log and daily goals (Phase 5a) ----
// Entries: { uid, user, date 'YYYY-MM-DD', meal, recipe_id, ver, portion, label, kcal, P, C, F }
// user is the Supabase user id in the synced app, 'me' in the preview.
Object.assign(T.zh, {
  tToday: '今天', todayEyebrow: 'Today · 今天', goalSet: '在「我」里设每天的目标', eaten: '已吃', left: n => `还差 ${n}`, over: n => `超了 ${n}`,
  protein: '蛋白质', carbs: '碳水', fat: '脂肪', mealB: '早餐', mealL: '午餐', mealD: '晚餐', mealS: '加餐', nothing: '还没记录',
  logTitle: '记一餐', fromPlan: '今天菜单上的', noPlanToday: '今天菜单上没有菜。可以在食谱里打开一道菜记录，或者手填。',
  other: '手填其他食物', foodName: '吃了什么', kcalL: '热量 kcal', proteinL: '蛋白质 g（可不填）', portion: '份量', meal: '哪一餐',
  log: '记录', logged: '已记到今天。', remove: '删除', goalsH: '每天的目标', kcalGoal: '热量 kcal', proteinGoal: '蛋白质 g', saveGoals: '保存目标',
  goalsSaved: '目标已保存。', goalsHint: '只用来显示进度。对方也看得到你的记录和目标。', logRecipe: '记到今天的饮食', portionN: p => `${p} 份`,
  dayLabel: d => `${d.getMonth() + 1}月${d.getDate()}日 ${DAYS_I.zh[(d.getDay() + 6) % 7]}`, prevDay: '前一天', nextDay: '后一天', today: '回到今天',
  whose: '看谁的', readOnly: n => `${n} 的记录，只能看。`, partnerNoGoal: '还没设目标',
});
Object.assign(T.en, {
  tToday: 'Today', todayEyebrow: 'Today', goalSet: 'Set daily goals in Me', eaten: 'Eaten', left: n => `${n} to go`, over: n => `${n} over`,
  protein: 'Protein', carbs: 'Carbs', fat: 'Fat', mealB: 'Breakfast', mealL: 'Lunch', mealD: 'Dinner', mealS: 'Snack', nothing: 'Nothing logged yet',
  logTitle: 'Log a meal', fromPlan: 'On today’s plan', noPlanToday: 'Nothing planned today. Open a recipe to log it, or enter something by hand.',
  other: 'Something else', foodName: 'What you ate', kcalL: 'Calories (kcal)', proteinL: 'Protein g (optional)', portion: 'Portion', meal: 'Meal',
  log: 'Log it', logged: 'Logged for today.', remove: 'Remove', goalsH: 'Daily goals', kcalGoal: 'Calories (kcal)', proteinGoal: 'Protein (g)', saveGoals: 'Save goals',
  goalsSaved: 'Goals saved.', goalsHint: 'Only used to show progress. Your partner can see your log and goals too.', logRecipe: 'Log to today’s food', portionN: p => `${p} portion${p === 1 ? '' : 's'}`,
  dayLabel: d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }), prevDay: 'Previous day', nextDay: 'Next day', today: 'Back to today',
  whose: 'Whose log', readOnly: n => `${n}’s log, view only.`, partnerNoGoal: 'No goals yet',
});
ICON.today = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>';

const MEALS = ['breakfast', 'lunch', 'dinner', 'snack'];
const mealName = m => t({ breakfast: 'mealB', lunch: 'mealL', dinner: 'mealD', snack: 'mealS' }[m]);
const PORTIONS = [0.5, 1, 1.5, 2];
S.intake = load('intake', []);
S.goals = load('goals', {});          // { [user]: { kcal, protein } }
Object.assign(S, { dayOff: 0, whose: null, logForm: null, logMsg: '' });
const persistFit = () => { save('intake', S.intake); save('goals', S.goals); };

const me = () => (Sync.enabled && Sync.st.user ? Sync.st.user.id : 'me');
const pad2 = n => String(n).padStart(2, '0');
const ymdOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function dateAt(off) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + off); return d; }
function mondayOf(d) { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return ymdOf(x); }
function defaultMeal() { const h = new Date().getHours(); return h < 10 ? 'breakfast' : h < 15 ? 'lunch' : h < 21 ? 'dinner' : 'snack'; }
// "610–770" -> 690: a range is logged at its midpoint
const mid = s => { const a = String(s).replace(/,/g, '').match(/[\d.]+/g).map(Number); return a.reduce((x, y) => x + y, 0) / a.length; };

function recipeEntry(r, ver, portion, meal, date) {
  const n = (r.versions[ver] || r.versions.orig).n;
  const k = x => Math.round(mid(x) * portion);
  return { uid: Sync.newId(), user: me(), date, meal, recipe_id: r.id, ver: r.versions[ver] ? ver : 'orig', portion, label: '', kcal: k(n.kcal), P: k(n.P), C: k(n.C), F: k(n.F) };
}
function addEntry(e) { S.intake.push(e); persistFit(); Sync.op('intake_upsert', e); }
function entryTitle(e) {
  if (!e.recipe_id) return e.label;
  const r = byId(e.recipe_id); if (!r) return e.label || e.recipe_id;
  return title(r) + (r.versions.light ? ` · ${t(e.ver === 'light' ? 'light' : 'orig')}` : '');
}

function bar(label, val, goal, unit) {
  const pct = goal ? Math.min(100, Math.round(val / goal * 100)) : 0, overBy = goal && val > goal;
  const note = goal ? (overBy ? t('over', `${val - goal} ${unit}`) : t('left', `${goal - val} ${unit}`)) : '';
  return `<div class="gbar"><div class="gtop"><span>${label}</span><b>${val}${goal ? ` / ${goal}` : ''} ${unit}</b></div>
    ${goal ? `<div class="track"><span class="${overBy ? 'over' : ''}" style="width:${pct}%"></span></div><span class="muted gnote">${note}</span>` : ''}</div>`;
}

function viewToday() {
  const d = dateAt(S.dayOff), date = ymdOf(d), who = S.whose || me(), mine = who === me();
  const people = Sync.enabled && Sync.st.members.length > 1 ? Sync.st.members : null;
  const rows = S.intake.filter(e => e.user === who && e.date === date);
  const sum = k => rows.reduce((x, e) => x + (e[k] || 0), 0);
  const g = S.goals[who] || {};
  const name = people ? ((people.find(m => m.user_id === who) || {}).display_name || '') : '';
  const summary = `<section class="panel">${bar(t('eaten'), sum('kcal'), g.kcal, 'kcal')}${bar(t('protein'), sum('P'), g.protein, 'g')}
    <p class="muted">${t('carbs')} ${sum('C')} g · ${t('fat')} ${sum('F')} g</p>
    ${!g.kcal && !g.protein ? `<p class="muted">${mine ? `<button class="linkish" data-act="tab" data-t="me">${t('goalSet')}</button>` : t('partnerNoGoal')}</p>` : ''}</section>`;
  const meals = MEALS.map(m => {
    const list = rows.filter(e => e.meal === m);
    if (!list.length) return '';
    return `<section><h3 class="group">${mealName(m)}</h3><ul class="ing log">${list.map(e => `<li><span class="nm">${esc(entryTitle(e))}${e.portion && e.portion !== 1 ? ` <span class="muted">× ${e.portion}</span>` : ''}</span>
      <span class="q">${e.kcal} kcal${e.P ? `<small>${e.P} g ${t('protein')}</small>` : ''}</span>${mine ? `<button class="ghost" data-act="ldel" data-u="${e.uid}" aria-label="${t('remove')} ${esc(entryTitle(e))}">${t('remove')}</button>` : ''}</li>`).join('')}</ul></section>`;
  }).join('') || `<p class="empty">${t('nothing')}</p>`;
  const whoSeg = people ? `<div class="seg" role="group" aria-label="${t('whose')}" style="align-self:flex-start">${people.map(m => `<button data-act="whose" data-u="${m.user_id}" aria-pressed="${m.user_id === who}">${esc(m.display_name || '—')}</button>`).join('')}</div>` : '';
  return `<main><div class="page-head"><div class="bar"><span class="eyebrow">${t('todayEyebrow')}</span>${langBtn()}</div>
      <div class="daynav"><button class="ghost" data-act="dprev" aria-label="${t('prevDay')}">‹</button><h1>${esc(t('dayLabel', d))}</h1><button class="ghost" data-act="dnext" aria-label="${t('nextDay')}">›</button></div>
      ${S.dayOff ? `<button class="linkish" data-act="dtoday">${t('today')}</button>` : ''}${syncLine()}</div>
    ${whoSeg}${!mine ? `<p class="muted">${esc(t('readOnly', name))}</p>` : ''}
    ${summary}${meals}${mine ? logPanel(d, date) : ''}</main>`;
}

function logPanel(d, date) {
  const f = S.logForm;
  const sameWeek = mondayOf(d) === mondayOf(new Date());
  const planned = sameWeek ? S.plan.filter(e => e.day === (d.getDay() + 6) % 7) : [];
  const chips = planned.length ? `<div class="chips">${planned.map(e => { const r = byId(e.id); return `<button class="chip" data-act="lpick" data-id="${r.id}" data-v="${e.ver}" aria-pressed="${!!(f && f.recipe_id === r.id)}">${esc(title(r))}</button>`; }).join('')}
      <button class="chip" data-act="lother" aria-pressed="${!!(f && f.other)}">${t('other')}</button></div>`
    : `<p class="muted">${t('noPlanToday')}</p><div class="chips"><button class="chip" data-act="lother" aria-pressed="${!!(f && f.other)}">${t('other')}</button></div>`;
  let form = '';
  if (f) {
    const segMeal = `<div class="row"><span class="label">${t('meal')}</span><div class="seg">${MEALS.map(m => `<button data-act="lmeal" data-m="${m}" aria-pressed="${f.meal === m}">${mealName(m)}</button>`).join('')}</div></div>`;
    if (f.other) form = `${segMeal}<label class="field"><span>${t('foodName')}</span><input id="l-name" type="text" value="${esc(f.name || '')}"></label>
      <div class="two"><label class="field"><span>${t('kcalL')}</span><input id="l-kcal" type="number" inputmode="numeric" min="0" value="${esc(f.kcal || '')}"></label>
      <label class="field"><span>${t('proteinL')}</span><input id="l-p" type="number" inputmode="numeric" min="0" value="${esc(f.p || '')}"></label></div>
      <button class="action" data-act="lsave">${t('log')}</button>`;
    else {
      const r = byId(f.recipe_id), e = recipeEntry(r, f.ver, f.portion, f.meal, date);
      form = `${segMeal}${r.versions.light ? `<div class="row"><span class="label">${t('version')}</span><div class="seg"><button data-act="lver" data-v="orig" aria-pressed="${f.ver === 'orig'}">${t('orig')}</button><button data-act="lver" data-v="light" aria-pressed="${f.ver === 'light'}">${t('light')}</button></div></div>` : ''}
        <div class="row"><span class="label">${t('portion')}</span><div class="seg">${PORTIONS.map(p => `<button data-act="lport" data-p="${p}" aria-pressed="${f.portion === p}">${p}</button>`).join('')}</div></div>
        <button class="action" data-act="lsave">${t('log')} · ${e.kcal} kcal · ${e.P} g ${t('protein')}</button>`;
    }
  }
  return `<div class="section-title"><h2>${t('logTitle')}</h2></div><section class="panel"><span class="label">${t('fromPlan')}</span>${chips}${form}
    ${S.logMsg ? `<span class="toast" role="status">${esc(S.logMsg)}</span>` : ''}</section>`;
}

function goalsPanel() {
  const g = S.goals[me()] || {};
  return `<section class="panel"><span class="label">${t('goalsH')}</span>
    <div class="two"><label class="field"><span>${t('kcalGoal')}</span><input id="g-kcal" type="number" inputmode="numeric" min="800" max="6000" value="${g.kcal || ''}"></label>
    <label class="field"><span>${t('proteinGoal')}</span><input id="g-p" type="number" inputmode="numeric" min="20" max="400" value="${g.protein || ''}"></label></div>
    <button class="action" data-act="gsave">${t('saveGoals')}</button>${S.logMsg === t('goalsSaved') ? `<span class="toast" role="status">${t('goalsSaved')}</span>` : ''}
    <p class="muted">${t('goalsHint')}</p></section>`;
}

// clicks for this tab; returns true when handled
function fitnessClick(a, b) {
  const val = id => (document.getElementById(id) || {}).value || '';
  const date = ymdOf(dateAt(S.dayOff));
  const reset = () => { S.logForm = null; };
  // keep what was typed in the free-entry form when another button re-renders it
  if (S.logForm && S.logForm.other) Object.assign(S.logForm, { name: val('l-name'), kcal: val('l-kcal'), p: val('l-p') });
  switch (a) {
    case 'dprev': S.dayOff--; reset(); S.logMsg = ''; break;
    case 'dnext': S.dayOff++; reset(); S.logMsg = ''; break;
    case 'dtoday': S.dayOff = 0; reset(); S.logMsg = ''; break;
    case 'whose': S.whose = b.dataset.u; reset(); break;
    case 'lpick': S.logForm = { recipe_id: b.dataset.id, ver: b.dataset.v, portion: 1, meal: defaultMeal() }; S.logMsg = ''; break;
    case 'lother': S.logForm = { other: true, meal: defaultMeal() }; S.logMsg = ''; break;
    case 'lmeal': S.logForm.meal = b.dataset.m; break;
    case 'lver': S.logForm.ver = b.dataset.v; break;
    case 'lport': S.logForm.portion = +b.dataset.p; break;
    case 'lsave': {
      const f = S.logForm;
      if (f.other) {
        const label = val('l-name').trim(), kcal = Math.round(+val('l-kcal'));
        if (!label || !(kcal >= 0)) return true;
        addEntry({ uid: Sync.newId(), user: me(), date, meal: f.meal, recipe_id: null, ver: null, portion: 1, label, kcal, P: Math.round(+val('l-p')) || 0, C: 0, F: 0 });
      } else addEntry(recipeEntry(byId(f.recipe_id), f.ver, f.portion, f.meal, date));
      reset(); S.logMsg = t('logged'); break;
    }
    case 'ldel': { const i = S.intake.findIndex(e => e.uid === b.dataset.u); if (i >= 0) { S.intake.splice(i, 1); persistFit(); Sync.op('intake_delete', b.dataset.u); } break; }
    case 'gsave': {
      const kcal = Math.round(+val('g-kcal')) || null, protein = Math.round(+val('g-p')) || null;
      S.goals[me()] = { kcal, protein }; persistFit(); Sync.op('goals_save', { kcal, protein }); S.logMsg = t('goalsSaved'); break;
    }
    case 'rlog': {   // from the recipe page: log the version and portion being viewed
      const r = byId(S.recipe), ver = r.versions.light ? S.ver : 'orig';
      addEntry(recipeEntry(r, ver, 1, defaultMeal(), ymdOf(dateAt(0)))); S.logged = r.id; break;
    }
    default: return false;
  }
  persistFit(); render(); return true;
}

render();
Sync.init();

</script>
